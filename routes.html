<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>航線網絡與航點資訊 | Virtual Tigerair Taiwan</title>
    <link rel="stylesheet" href="assets/styles.css">
    <!-- Leaflet.js 地圖庫 -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        .network-container {
            max-width: 1400px;
            margin: 25px auto 50px;
            padding: 0 20px;
        }

        /* 雙欄核心排版 */
        .station-layout {
            display: grid;
            grid-template-columns: 460px 1fr;
            gap: 25px;
            align-items: start;
        }

        /* 左側航點捲動清單 */
        .station-sidebar {
            background: #ffffff;
            border-radius: 12px;
            box-shadow: 0 8px 24px rgba(0,0,0,0.06);
            border-top: 5px solid var(--tiger-yellow);
            height: 750px;
            overflow-y: auto;
            padding: 16px 20px;
        }

        .station-sidebar::-webkit-scrollbar {
            width: 6px;
        }
        .station-sidebar::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 4px;
        }
        .station-sidebar::-webkit-scrollbar-thumb {
            background: #ccc;
            border-radius: 4px;
        }
        .station-sidebar::-webkit-scrollbar-thumb:hover {
            background: var(--tiger-yellow);
        }

        .station-category {
            font-size: 1.05rem;
            font-weight: 800;
            color: var(--tiger-black);
            margin: 18px 0 10px 0;
            padding-bottom: 6px;
            border-bottom: 2px solid var(--tiger-yellow);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 航點卡片 */
        .station-card {
            display: flex;
            gap: 14px;
            background: #ffffff;
            border: 1.5px solid #edf0f2;
            border-radius: 10px;
            padding: 12px;
            margin-bottom: 12px;
            cursor: pointer;
            transition: all 0.25s ease;
            position: relative;
        }

        .station-card:hover {
            transform: translateY(-2px);
            border-color: var(--tiger-yellow);
            box-shadow: 0 6px 16px rgba(255, 194, 14, 0.2);
        }

        .station-card.active {
            border-color: var(--tiger-orange);
            background-color: #fffdf5;
            box-shadow: 0 4px 14px rgba(243, 112, 33, 0.25);
        }

        .station-card.active::after {
            content: '●';
            position: absolute;
            right: 14px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--tiger-orange);
            font-size: 1.2rem;
        }

        .station-thumb {
            width: 105px;
            height: 75px;
            object-fit: cover;
            border-radius: 6px;
            flex-shrink: 0;
            background: #e2e8f0;
        }

        .station-details {
            flex-grow: 1;
        }

        .station-title-row {
            display: flex;
            align-items: baseline;
            gap: 8px;
            margin-bottom: 4px;
        }

        .station-code {
            font-size: 1.1rem;
            font-weight: 800;
            color: var(--tiger-black);
        }

        .station-name {
            font-size: 0.95rem;
            font-weight: 700;
            color: #444;
        }

        .station-info {
            font-size: 0.8rem;
            color: #666;
            line-height: 1.5;
        }

        /* 右側地圖容器 */
        .station-map-view {
            background: #14171a;
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.15);
            height: 750px;
            position: sticky;
            top: 85px;
            border: 2px solid #23272e;
            overflow: hidden;
            position: relative;
        }

        #tiger-map {
            width: 100%;
            height: 100%;
            background: #14171a;
        }

        /* 地圖控制按鈕與提示 */
        .map-overlay-badge {
            position: absolute;
            top: 15px;
            right: 15px;
            z-index: 1000;
            background: rgba(17, 20, 24, 0.9);
            backdrop-filter: blur(8px);
            padding: 12px 18px;
            border-radius: 8px;
            border: 1px solid rgba(255, 194, 14, 0.4);
            color: #ffffff;
            font-size: 0.85rem;
        }

        .map-overlay-badge strong {
            color: var(--tiger-yellow);
        }

        .btn-show-all {
            margin-top: 8px;
            background: var(--tiger-yellow);
            color: #111;
            border: none;
            padding: 6px 14px;
            border-radius: 4px;
            font-size: 0.75rem;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
            display: block;
            width: 100%;
        }

        .btn-show-all:hover {
            background: #e5ae0c;
        }

        /* 大字區域標籤 */
        .leaflet-tooltip-region {
            background: transparent !important;
            border: none !important;
            box-shadow: none !important;
            color: rgba(255, 255, 255, 0.8) !important;
            font-size: 1.35rem !important;
            font-weight: 800 !important;
            letter-spacing: 3px !important;
            text-shadow: 0 2px 8px rgba(0,0,0,0.9);
        }
